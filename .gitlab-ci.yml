stages:
  - test
  - post-test
  - deploy
  - publish

variables:
  PROJECT_NAME: l3-bundle-management

include:
  - project: "ci/common-ci"
    ref: rocketor
    file: "unit-test/js-unit-test.gitlab-ci.yml"
  - project: "ci/common-ci"
    ref: rocketor
    file: "sonarqube/sonarqube.js-unittest.gitlab-ci.yml"
  - project: "ci/common-ci"
    ref: master
    file: "npm/publish-npm-ts.gitlab-ci.yml"
  - project: "indo-market/ci"
    ref: main
    file: "using-renovate.yml"

unit-test-js:
  artifacts:
    reports:
      junit: coverage/*.xml
      cobertura: coverage/cobertura-coverage.xml
